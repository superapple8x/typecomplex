<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta http-equiv="Content-Security-Policy" content="default-src 'self'; img-src 'self' data:; style-src 'self' 'unsafe-inline'; script-src 'self'; connect-src http://127.0.0.1:5001 http://localhost:5001; frame-src 'none'; object-src 'none'">
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>TypeComplex</title>
    <style>
      html, body { height: 100%; margin: 0; font-family: system-ui, -apple-system, Segoe UI, Roboto, Ubuntu, Cantarell, Noto Sans, Arial, sans-serif; color: #111; }
      .container { display: flex; flex-direction: column; height: 100%; }
      header { padding: 12px 16px; border-bottom: 1px solid #e5e7eb; display: flex; align-items: center; justify-content: space-between; }
      main { padding: 16px; flex: 1; overflow: auto; }
      .status { padding: 12px; border-radius: 8px; background: #f9fafb; border: 1px solid #e5e7eb; margin-bottom: 12px; }
      .row { display: flex; gap: 8px; align-items: center; margin: 8px 0; }
      button { appearance: none; border: 1px solid #d1d5db; background: #111827; color: white; border-radius: 6px; padding: 6px 12px; cursor: pointer; }
      button.secondary { background: white; color: #111; }
      code { background: #f3f4f6; padding: 2px 6px; border-radius: 4px; }
      .muted { color: #6b7280; }
      .ok { color: #065f46; }
      .warn { color: #92400e; }
      .error { color: #991b1b; }
      footer { padding: 8px 16px; border-top: 1px solid #e5e7eb; font-size: 12px; color: #6b7280; }
    </style>
  </head>
  <body>
    <div class="container">
      <header>
        <div>TypeComplex (Electron)</div>
        <div class="row">
          <button id="btn-check">Check Health</button>
          <button id="btn-open" class="secondary">Open PDF…</button>
        </div>
      </header>
      <main>
        <div class="status" id="status">
          <div class="row"><strong>Status:</strong> <span id="status-text" class="muted">Waiting…</span></div>
          <div class="row"><strong>Backend URL:</strong> <code id="backend-url" class="muted">(not connected)</code></div>
          <div class="row"><strong>Details:</strong> <span id="details" class="muted">—</span></div>
        </div>
        <pre id="log" style="white-space: pre-wrap; font-size: 12px; background: #f9fafb; border: 1px solid #e5e7eb; padding: 12px; border-radius: 8px; max-height: 45vh; overflow: auto;"></pre>
      </main>
      <footer>
        This is a development UI. Final UI will replace this screen.
      </footer>
    </div>
    <script src="renderer.js"></script>
  </body>
</html>
